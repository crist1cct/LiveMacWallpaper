name: WallpaperStudio
options:
  bundleIdPrefix: com.wallpaperstudio
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  WallpaperCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5LNL28C3Z4
    CURRENT_PROJECT_VERSION: 160
    MARKETING_VERSION: "1.6.0"

targets:
  WallpaperStudio:
    type: application
    platform: macOS
    sources:
      - path: Apps/WallpaperStudio
    resources:
      - path: Apps/WallpaperStudio/Resources
    dependencies:
      - package: WallpaperCore
      - target: WallpaperStudioWallpaperExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallpaperstudio.app
        PRODUCT_NAME: Wallpaper Studio
        INFOPLIST_FILE: Apps/WallpaperStudio/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  WallpaperStudioWallpaperExtension:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Extensions/WallpaperStudioWallpaper
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallpaperstudio.app.wallpaper-extension
        PRODUCT_NAME: WallpaperStudioWallpaperExtension
        INFOPLIST_FILE: Extensions/WallpaperStudioWallpaper/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Wallpaper Studio
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Extensions/WallpaperStudioWallpaper/WallpaperStudioWallpaperExtension.entitlements
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: Extensions/WallpaperStudioWallpaper/WallpaperExtension-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

  WallpaperRenderer:
    type: application
    platform: macOS
    sources:
      - path: Apps/WallpaperRenderer
    dependencies:
      - package: WallpaperCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallpaperstudio.renderer
        PRODUCT_NAME: WallpaperRenderer
        INFOPLIST_FILE: Apps/WallpaperRenderer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  WallpaperStudioScreenSaver:
    type: bundle
    platform: macOS
    sources:
      - path: Extensions/WallpaperStudioScreenSaver
    dependencies:
      - package: WallpaperCore
      - sdk: ScreenSaver.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallpaperstudio.screensaver
        PRODUCT_NAME: Wallpaper Studio
        PRODUCT_MODULE_NAME: WallpaperStudioScreenSaver
        INFOPLIST_FILE: Extensions/WallpaperStudioScreenSaver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        WRAPPER_EXTENSION: saver
        MACH_O_TYPE: mh_bundle
        SKIP_INSTALL: YES

  LoginWallpaperInstaller:
    type: tool
    platform: macOS
    sources:
      - path: Apps/LoginWallpaperInstaller
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallpaperstudio.login-installer
        PRODUCT_NAME: LoginWallpaperInstaller
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

schemes:
  WallpaperStudio:
    build:
      targets:
        WallpaperStudio: all
        WallpaperStudioWallpaperExtension: all
        WallpaperRenderer: all
        WallpaperStudioScreenSaver: all
        LoginWallpaperInstaller: all
    run:
      config: Debug
    archive:
      config: Release
