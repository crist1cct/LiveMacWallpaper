name: LiveMacWallpaper
options:
  bundleIdPrefix: com.livemacwallpaper
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  WallpaperCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5LNL28C3Z4
    CURRENT_PROJECT_VERSION: 180
    MARKETING_VERSION: "1.8.0"

targets:
  LiveMacWallpaper:
    type: application
    platform: macOS
    sources:
      - path: Apps/LiveMacWallpaper
    resources:
      - path: Apps/LiveMacWallpaper/Resources
    dependencies:
      - package: WallpaperCore
      - target: LiveMacWallpaperExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livemacwallpaper.app
        PRODUCT_NAME: Live Mac Wallpaper
        INFOPLIST_FILE: Apps/LiveMacWallpaper/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  LiveMacWallpaperExtension:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Extensions/LiveMacWallpaperExtension
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livemacwallpaper.app.wallpaper-extension
        PRODUCT_NAME: LiveMacWallpaperExtension
        INFOPLIST_FILE: Extensions/LiveMacWallpaperExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: LMW
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Extensions/LiveMacWallpaperExtension/LiveMacWallpaperExtension.entitlements
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: Extensions/LiveMacWallpaperExtension/WallpaperExtension-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

  WallpaperRenderer:
    type: application
    platform: macOS
    sources:
      - path: Apps/WallpaperRenderer
    dependencies:
      - package: WallpaperCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livemacwallpaper.renderer
        PRODUCT_NAME: WallpaperRenderer
        INFOPLIST_FILE: Apps/WallpaperRenderer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  LiveMacWallpaperScreenSaver:
    type: bundle
    platform: macOS
    sources:
      - path: Extensions/LiveMacWallpaperScreenSaver
    dependencies:
      - package: WallpaperCore
      - sdk: ScreenSaver.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livemacwallpaper.screensaver
        PRODUCT_NAME: Live Mac Wallpaper
        PRODUCT_MODULE_NAME: LiveMacWallpaperScreenSaver
        INFOPLIST_FILE: Extensions/LiveMacWallpaperScreenSaver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        WRAPPER_EXTENSION: saver
        MACH_O_TYPE: mh_bundle
        SKIP_INSTALL: YES

  LoginWallpaperInstaller:
    type: tool
    platform: macOS
    sources:
      - path: Apps/LoginWallpaperInstaller
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livemacwallpaper.login-installer
        PRODUCT_NAME: LoginWallpaperInstaller
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

schemes:
  LiveMacWallpaper:
    build:
      targets:
        LiveMacWallpaper: all
        LiveMacWallpaperExtension: all
        WallpaperRenderer: all
        LiveMacWallpaperScreenSaver: all
        LoginWallpaperInstaller: all
    run:
      config: Debug
    archive:
      config: Release
